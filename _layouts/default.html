<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-surface-hover: #f1f5f9;
      --color-border: #e2e8f0;
      --color-border-subtle: #f1f5f9;
      --color-text: #0f172a;
      --color-text-muted: #64748b;
      --color-text-faint: #94a3b8;
      --color-primary: #2563eb;
      --color-primary-light: #eff6ff;
      --color-primary-dark: #1d4ed8;
      --color-accent: #0284c7;
      --color-card-shadow: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --color-card-shadow-hover: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0b0f19;
        --color-surface: #111827;
        --color-surface-hover: #1f2937;
        --color-border: #1f2937;
        --color-border-subtle: #162032;
        --color-text: #f8fafc;
        --color-text-muted: #94a3b8;
        --color-text-faint: #64748b;
        --color-primary: #3b82f6;
        --color-primary-light: rgba(59, 130, 246, 0.12);
        --color-primary-dark: #60a5fa;
        --color-accent: #38bdf8;
        --color-card-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        --color-card-shadow-hover: 0 6px 12px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Navigation Banner */
    .top-nav {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .nav-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--color-text);
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      list-style: none;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .nav-links a {
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--color-primary);
    }

    .nav-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.65rem;
      background: var(--color-primary-light);
      color: var(--color-primary);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      font-family: var(--font-mono);
      text-decoration: none;
    }

    /* Main Container */
    .main-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Header Hero Section */
    .hero-header {
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--color-border);
    }

    .hero-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    h1, .hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--color-text);
      line-height: 1.2;
    }

    .version-pill {
      background: var(--color-primary);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-full);
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.25);
    }

    .hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      color: var(--color-text-muted);
      font-size: 0.925rem;
    }

    .hero-meta-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .hero-meta-divider {
      color: var(--color-text-faint);
    }

    .schedule-chip {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }

    /* AI Weekly Synthesis Card Container */
    .synthesis-section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary);
      border-radius: var(--radius-md);
      padding: 1.75rem 2rem;
      margin-bottom: 3rem;
      box-shadow: var(--color-card-shadow);
    }

    .synthesis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--color-border);
    }

    .synthesis-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .synthesis-badge {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
    }

    /* Content Typography within Synthesis */
    .synthesis-section h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 1.5rem 0 0.6rem;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .synthesis-section p {
      margin-bottom: 1rem;
      color: var(--color-text);
      font-size: 0.975rem;
    }

    .synthesis-section ul {
      margin-left: 1.25rem;
      margin-bottom: 1rem;
    }

    .synthesis-section li {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    /* Section Headings */
    .section-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 3rem 0 1.25rem;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .topic-group-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 2rem 0 1rem;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--color-border);
    }

    /* Developments Cards & 3-Line Gists */
    .dev-card-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .item-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--color-card-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .item-card:hover {
      box-shadow: var(--color-card-shadow-hover);
      border-color: rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .item-title a {
      color: var(--color-text);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .item-title a:hover {
      color: var(--color-primary);
    }

    .item-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .badge-source {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-size: 0.725rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
    }

    .badge-source.source-arxiv {
      background: rgba(180, 83, 9, 0.1);
      color: #b45309;
    }

    .badge-source.source-github {
      background: rgba(30, 41, 59, 0.1);
      color: #334155;
    }

    @media (prefers-color-scheme: dark) {
      .badge-source.source-github {
        background: rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
      }
    }

    .badge-source.source-hn {
      background: rgba(234, 88, 12, 0.1);
      color: #ea580c;
    }

    .item-date {
      color: var(--color-text-faint);
      font-size: 0.8rem;
    }

    /* 3-Line Gist Box */
    .gist-box {
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      border: 1px solid var(--color-border-subtle);
    }

    .gist-line {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.9rem;
      line-height: 1.45;
      color: var(--color-text);
    }

    .gist-label {
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
      min-width: 82px;
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-sm);
    }

    .gist-label-what {
      background: rgba(37, 99, 235, 0.1);
      color: #2563eb;
    }

    .gist-label-details {
      background: rgba(13, 148, 136, 0.1);
      color: #0d9488;
    }

    .gist-label-impact {
      background: rgba(124, 58, 237, 0.1);
      color: #7c3aed;
    }

    /* Archive Grid */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .archive-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      transition: border-color 0.15s, transform 0.15s;
    }

    .archive-card:hover {
      border-color: var(--color-primary);
      transform: translateY(-1px);
    }

    .archive-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--color-primary);
    }

    .archive-desc {
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--color-border);
      margin-top: 4rem;
      padding-top: 2rem;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
      text-align: center;
    }

    footer a {
      color: var(--color-primary);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .hero-title {
        font-size: 1.75rem;
      }
      .nav-links {
        display: none;
      }
      .item-header {
        flex-direction: column;
      }
      .gist-line {
        flex-direction: column;
        gap: 0.15rem;
      }
      .gist-label {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-container">
      <a href="./" class="brand">
        <div class="brand-icon">⚡</div>
        <span>AgentWire</span>
      </a>
      <ul class="nav-links">
        <li><a href="#synthesis">AI Synthesis</a></li>
        <li><a href="#ai-and-llms">AI & LLMs</a></li>
        <li><a href="#agents-and-automation">Agents & Automation</a></li>
        <li><a href="#archive">Archive</a></li>
        <li><a href="https://github.com/govindarajanv/AgentWire" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <a href="https://github.com/govindarajanv/AgentWire" class="nav-badge">
        <span>v1.1.0</span>
      </a>
    </div>
  </nav>

  <main class="main-wrapper">
    {{ content }}
  </main>

  <footer>
    <div>
      <strong>AgentWire</strong> &bull; Curated weekly AI intelligence synthesized by <a href="https://github.com/govindarajanv/inference" target="_blank" rel="noopener">Kilo Gateway Inference Action</a>.
    </div>
    <div>
      Runs automatically every <strong>Sunday at 09:00 AM IST</strong> (03:30 UTC) &bull; Published under MIT License.
    </div>
  </footer>

</body>
</html>
