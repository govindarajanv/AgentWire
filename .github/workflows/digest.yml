name: Publish Weekly AI World Summary

on:
  schedule:
    - cron: '30 3 * * 0' # Every Sunday at 9:00 AM IST (03:30 AM UTC)
  workflow_dispatch:

concurrency:
  group: weekly-summary
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.x'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Prepare Weekly Digest & AI Prompt
        id: prepare
        run: python scripts/digest.py --prepare-prompt --days 7

      - name: Generate AI Weekly Summary
        uses: govindarajanv/inference@v1
        id: ai
        with:
          prompt: ${{ steps.prepare.outputs.prompt }}
          system_prompt: 'You are an elite AI analyst and technology journalist. Synthesize the provided raw developments from the past week into an insightful, well-structured Weekly AI World Summary in Markdown with: 1. Executive Overview, 2. Frontier Models & LLM Innovations, 3. Autonomous Agents & Ecosystem, 4. Research Breakthroughs & Novel Approaches, and 5. Industry Impact & Key Trends.'
          model: 'kilo-auto/free'
          fallback_models: 'kilo-auto/free,deepseek/deepseek-v4-flash-0731:free,stepfun/step-3.7-flash:free,qwen/qwen3.8-27b:free,nvidia/nemotron-3-ultra-550b-a55b:free'
          save_to_file: 'ai_summary.md'
          max_tokens: '2048'
          temperature: '0.6'
          fail_on_error: 'false'

      - name: Render Weekly Summary Page
        env:
          AI_MODEL_USED: ${{ steps.ai.outputs.model_used }}
          AI_SUCCESS: ${{ steps.ai.outputs.success }}
          DIGEST_ENGINE: 'Kilo Gateway (govindarajanv/inference)'
        run: python scripts/digest.py --render --days 7 --summary-file ai_summary.md

      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.md
          for archive in archive-*.md; do
            [ -e "$archive" ] && git add "$archive"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Weekly AI World Summary'
            git fetch origin "${GITHUB_REF_NAME:-master}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME:-master}" || (git rebase --abort && git merge --strategy-option=theirs -m "Merge remote changes into published summary" "origin/${GITHUB_REF_NAME:-master}")
            git push origin "HEAD:${GITHUB_REF_NAME:-master}"
          fi

      - name: Build Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy Pages site
        uses: actions/deploy-pages@v4
