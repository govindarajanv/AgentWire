name: Publish AI digest

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.x'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Generate digest
        env:
          DIGEST_ENGINE: GitHub Actions
        run: python scripts/digest.py
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.md
          for archive in archive-*.md; do
            [ -e "$archive" ] && git add "$archive"
          done
          git diff --cached --quiet || git commit -m 'Publish AI digest'
          git push
      - name: Build Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy Pages site
        uses: actions/deploy-pages@v4
